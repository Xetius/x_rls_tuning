# Builds the mod and recorder zips and publishes them as a GitHub release
# whenever a version tag is pushed, e.g.:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Lua compiles
        run: |
          sudo apt-get install -y -qq luajit
          find mod -name '*.lua' -print0 | xargs -0 -n1 luajit -bl > /dev/null

      - name: Check the recorder compiles
        run: python -m py_compile recorder/*.py build.py test/fake_sender.py

      - name: Build
        run: python build.py --version "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Tuning Telemetry $GITHUB_REF_NAME" --generate-notes $prerelease
